<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalZone BD | 100% Authentic Halal Products</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        header { background-color: #0d5c3a; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-size: 24px; font-weight: bold; }
        .search-box input { padding: 8px 12px; border-radius: 4px; border: none; outline: none; width: 250px; }
        nav { background: #083d26; padding: 10px 20px; display: flex; gap: 15px; }
        nav a { color: white; text-decoration: none; font-size: 14px; }
        .hero { background: #e8f5e9; padding: 40px 20px; text-align: center; margin-bottom: 20px; }
        .hero h1 { color: #0d5c3a; margin-bottom: 10px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; }
        .card h3 { margin: 10px 0; font-size: 18px; }
        .price { color: #e63946; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .btn-btn { background: #25d366; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
        footer { text-align: center; padding: 20px; background: #0d5c3a; color: white; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">HalalZone BD</div>
        <div class="search-box">
            <input type="text" placeholder="প্রোডাক্ট খুঁজুন...">
        </div>
    </header>

    <nav>
        <a href="#">হোম</a>
        <a href="#">অল প্রোডাক্টস</a>
        <a href="#">অফার</a>
        <a href="#">যোগাযোগ</a>
    </nav>

    <section class="hero">
        <h1>Welcome to HalalZone BD</h1>
        <p>১০০% খাটি ও হালাল পণ্যের বিশ্বস্ত প্রতিষ্ঠান</p>
    </section>

    <main class="products">
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Product">
            <h3>Premium Organic Honey</h3>
            <div class="price">৳ ৮৫০</div>
            <a href="https://wa.me/8801700000000?text=I%20want%20to%20order%20Honey" class="btn-btn">WhatsApp Order</a>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Product">
            <h3>Black Seed Oil</h3>
            <div class="price">৳ ৫৫০</div>
            <a href="https://wa.me/8801700000000?text=I%20want%20to%20order%20Black%20Seed%20Oil" class="btn-btn">WhatsApp Order</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 HalalZone BD. All rights reserved.</p>
    </footer>

</body>
</html>
